<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kakao-tools</title>
<link rel="stylesheet" href="style.css">
<style>
:root{color-scheme:light dark;--card:#fff;--line:#ddd;--accent:#c0152a}
@media (prefers-color-scheme:dark){:root{--card:#202020;--line:#333;--accent:#ff4d5e}}
body{margin:0;padding:24px;font-family:-apple-system,"Noto Sans KR",sans-serif}
main{max-width:480px;margin:0 auto}
h1{font-size:20px}
a.link{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;color:var(--accent);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>kakao-tools</h1>
  <a class="link" href="https://kobe-craft.github.io/kakao-tools/" data-trap>kakao-tools 열기</a>
</main>

<div id="blk"></div>
<div id="term">
  <div id="out"></div>
  <div id="pops"></div>
  <canvas id="dmg"></canvas>
  <pre id="hud"></pre>
</div>

<script src="script.js"></script>
</body>
</html>
